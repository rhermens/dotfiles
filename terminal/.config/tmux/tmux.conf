setw -g mode-keys vi

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-clipboard on

set -g automatic-rename on
set -g set-titles on

set -sg escape-time 10

set-option -g focus-events on
set-option -g detach-on-destroy off

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"

set-hook -g client-session-changed 'run-shell "~/.config/tmux/session-unotify.sh \"#{session_name}\""; run-shell "~/.config/tmux/window-unotify.sh \"#{window_id}\""'
set-hook -g after-select-window 'run-shell "~/.config/tmux/window-unotify.sh \"#{window_id}\""'

bind -r f run-shell "~/.config/tmux/fzf-session.sh"

# Default choose-tree format (per tmux version) plus [𝜏] markers for @notify windows and @session_notify sessions.
%if "#{>=:#{version},3.8}"
set -g @tree-format '#{?pane_format,#{?pane_marked,#[fg=thememagenta],}#{?pane_floating_flag,#[underscore],}#{pane_current_command}#[fg=themelightgrey]#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},window_format,#{?@notify,[𝜏] ,}#{?window_marked_flag,#[fg=thememagenta],}#{window_name}#[fg=themelightgrey]#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{?@session_notify,[𝜏] ,}#[fg=themelightgrey]#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}'
%else
set -g @tree-format '#{?pane_format,#{?pane_marked,#[reverse],}#{?pane_floating_flag,#[italics],}#{pane_current_command}#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},window_format,#{?@notify,[𝜏] ,}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{?@session_notify,[𝜏] ,}#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}'
%endif
bind s choose-tree -Zs -F '#{E:@tree-format}'
bind w choose-tree -Zw -F '#{E:@tree-format}'

%if "#{>=:#{version},3.8}"
set -g theme dark
%endif
source-file ~/.config/tmux/tokyonight_night.tmux
source-file ~/.config/tmux/bar.tmux
